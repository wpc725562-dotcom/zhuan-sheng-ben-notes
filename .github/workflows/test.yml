name: Tests

# 2026-09-04：仓库有 26 个 unittest 覆盖 PDF 抽取管线（分流判定、页号解析、
# 图片页补齐、水印正则），但此前无 CI。水印正则误含「插本」会静默删掉正文
# 「广东专插本」，只有回归测试能拦住，所以必须每次 push 都跑。

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow

      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
