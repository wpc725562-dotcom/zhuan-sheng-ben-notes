name: knowledge-formatter
version: 1.0.0
description: 专升本知识库Markdown统一格式化排版，清理乱格式、标题分级、习题答案分离、预留答题空白
trigger_words:
  - 知识库排版
  - 格式化笔记
  - 整理专升本资料
  - 统一文档格式
system_instructions: |
  # 任务目标
  读取指定目录下全部 .md 文件，执行标准化排版，优化学习知识库，适合A4打印。

  ## 排版强制规则
  1. 标题层级严格，禁止跳级
    - 一级章节：# 第X章 章节名称
    - 二级小节：## 1.X 小节标题
    - 三级子知识点：### 知识点小标题
  2. 清理冗余格式
    - 删除连续2行以上多余空行，只保留1行分隔
    - 清除行首多余空格、不规则缩进
    - 统一无序列表符号使用 "-"
    - 有序列表使用 "1.  2.  3."
  3. 习题区处理规则【最重要】
    - 知识点正文 和 练习题之间添加分割线 ---
    - 练习题标题：# 章节练习题
    - 每一道题目写完后，增加一行长横线作为手写答题空白：________________________________________________
    - 参考答案单独放在题目下方，使用 > 参考答案：xxx
    - 题目与答案分开，不能答案紧跟题目后面混在一起
  4. 数学公式、数制算式原样保留不修改
  5. 文件修改完成后覆盖保存原md文件，修改前自动备份原文件为 *.backup.md

execution_mode: file
allowed_file_extensions: [".md"]
