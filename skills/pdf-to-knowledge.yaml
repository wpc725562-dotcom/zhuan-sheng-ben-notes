name: pdf-to-knowledge
version: 1.1.0
description: PDF试卷提取，清洗成标准考试排版，输出 .txt / .md 文件存入知识库仓库
trigger_words:
  - pdf转试卷
  - pdf导入知识库
  - 转换试卷pdf
system_instructions: |
  # 核心任务
  读取PDF试卷，提取文本，**修复阅读理解、长篇文本、多栏布局造成的排版错乱**，输出还原成和正式考卷阅读体验一致的干净文档，保存到知识库仓库。

  # 已知问题说明（你必须理解这些错乱成因）
  很多试卷PDF是双栏排版：左边一栏、右边一栏。
  原始PDF文本提取工具经常：
  1. 先读完左栏上半段 → 直接跳到右栏上半段，造成阅读理解文章句子被拦腰截断、段落顺序混乱。
  2. 阅读理解长文章被拆成大量零散碎行，一行只有几个单词，失去完整段落。
  3. 阅读文章文本、后面的题目选项ABCD顺序颠倒、文章跑到题目后面。
  4. 大量多余换行、无意义空白行。

  # 排版修复强制标准规则，严格执行
  ## 1. 阅读理解 / 长篇文章段落处理
  - 属于同一篇阅读短文的文字，**合并成完整连续段落**；
  - 文章内部不要随便换行；一个完整段落只保留一个换行在段落结束处；
  - 不要把文章的一句话强行切割成很多短行；
  - 文章结束之后空一行，再放对应的题目，**文章永远在对应题目的前面**。

  ## 2. 选择题、选项规则
  - 题号 `1.  2.  3.` 开启一道新题目；
  - A. B. C. D. 选项必须紧跟所属题目，选项不要单独成行乱跑；
  - 选项之间各自独立一行。

  ## 3. 文档输出格式
  二选一输出：
  模式一（txt纯文本）：保存后缀 `.txt`，无markdown标记；
  模式二（markdown）：后缀 `.md`，可以后续交给知识库排版skill继续处理。
  推荐模式二：完成后**自动调用 knowledge-formatter 排版skill**，统一标题层级、给每道题目添加答题横线空白区。

  ## 4. 目录存储规则
  转换完成的文件存入仓库路径：`./knowledge/exam_papers/`
  原始未清洗的提取结果备份到：`./knowledge/exam_papers/raw_backup/`，保留一份原始txt（命名为 `xxx-raw-backup.txt`），方便出错回滚。

  ## 5. 校验自检步骤（转换完成必须自查）
  转换结束后逐条检查：
  1. 阅读理解文章段落顺序有没有颠倒错乱？
  2. 是否存在一句话被拆成十几行碎行？
  3. 阅读文章是否放在对应题目的前面？
  4. 有没有多余连续空行？
  如果发现上述错乱，立刻重新清洗调整排版，直到阅读文本通顺、结构和正式试卷一致。

  # 硬性红线约束
  只修改换行、段落结构、排版格式；**绝对不能修改、增删阅读理解原文、题目文字、选项内容**。
execution_mode: file
allowed_file_extensions: [".pdf", ".txt", ".md"]
