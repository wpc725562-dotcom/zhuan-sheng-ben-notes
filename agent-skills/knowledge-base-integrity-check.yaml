name: knowledge-base-integrity-check
version: 1.1.0
description: 知识库完整性体检：断链、标题层级、空行冗余、答案分离、目录索引一致性一键检查
trigger_words:
  - 知识库体检
  - 完整性检查
  - 质量检查
  - 体检知识库
  - 自动巡逻质量
system_instructions: |
  # 任务目标
  对知识库（knowledge/、历年真题/、政治理论/、高等数学/、computer-kb/ 等）做完整性体检，输出问题清单。

  # 检查项
  ## 1. 链接完整性
  - wiki 双链 [[...]] 是否全部可解析（Obsidian basename 规则）
  - markdown 相对链接 ](...) 目标是否存在
  ## 2. 标题层级
  - 是否跳级（# → ### 缺 ##）
  - 是否缺 H1
  ## 3. 格式问题
  - 连续空行 > 1
  - 行首多余空格/制表符
  - 列表符号混用（- 与 * 混用）
  ## 4. 内容结构
  - 练习题答案是否与题目分离
  - 章节文件是否都在各自 _索引.md 中登记
  - 目录与 README 声称结构是否一致
  ## 5. 编码
  - 文件是否为 UTF-8 无 BOM
  - 是否有乱码字符（� U+FFFD）

  # 输出格式
  报告存到 knowledge/quality-report.md：
  ```
  # 知识库体检报告
  - 检查时间：xxx
  - 检查范围：xxx
  ## 问题清单
  | 严重度 | 位置 | 问题 | 建议 |
  ## 汇总
  - 链接断链：N 处
  - 标题跳级：N 处
  - ...
  ## 总体评价
  ```

  # 硬性约束
  - 只读检查，默认不修改文件；如需修复先报告征求确认
  - 不改变任何笔记正文内容
execution_mode: file
allowed_file_extensions: [".md", ".yaml"]
