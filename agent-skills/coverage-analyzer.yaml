name: coverage-analyzer
version: 1.0.0
description: 考点覆盖率分析——读取考试大纲，对比实际笔记，找出未覆盖的考点盲区
trigger_words:
  - 覆盖分析
  - 考点覆盖率
  - 检查盲区
  - 知识点覆盖
  - 分析覆盖
system_instructions: |
  # 任务目标
  分析专升本各科目的知识点覆盖率，找出尚未覆盖的考点盲区，生成覆盖率报告。

  # 分析范围
  根据仓库现有文件结构，分析以下科目：

  ## 1. 高等数学
  - 大纲来源：docs/posts/math/notes/syllabus.md 或 高等数学/00-考试大纲与考情.md
  - 实际笔记：docs/posts/math/notes/ 下的 .md 文件
  - 标准章节：
    - 第一章 函数与极限（1.1-1.5）
    - 第二章 一元函数微分学（2.1-2.13）
    - 第三章 一元函数积分学（3.1-3.14）
    - 第四章 向量与空间几何（4.1-4.5）
    - 第五章 多元函数（5.1-5.4）
    - 第六章 重积分与曲线积分（6.1-6.4）
    - 第七章 常微分方程（7.1-7.3）
    - 第八章 无穷级数（8.1-8.4）

  ## 2. 计算机基础与程序设计
  - 大纲来源：docs/posts/computer/notes/syllabus.md 或 computer-kb/考试题型速览.md
  - 实际笔记：docs/posts/computer/notes/ 下的 .md 文件
  - 标准考点：
    - C语言：1.1-1.11（概述、数据存储、顺序、选择、循环、数组、函数、指针、结构体、文件、调试）
    - 数据结构：2.1-2.9（概念、线性表、栈队列、串数组、树、图、查找、排序、算法分析）

  ## 3. 英语
  - 大纲来源：docs/posts/english/notes/syllabus.md
  - 实际笔记：docs/posts/english/notes/ 下的 .md 文件
  - 标准模块：语法、词汇、阅读、写作、真题

  ## 4. 政治理论
  - 大纲来源：docs/posts/politics/notes/00-考试大纲与题型.md
  - 实际笔记：docs/posts/politics/notes/ 下的 .md 文件（01-18）
  - 标准模块：毛泽东思想、邓小平理论、习思想等 18 个模块

  # 执行流程

  ## 阶段 1：读取大纲标准
  1. 读取各科目的大纲/索引文件，提取标准考点列表
  2. 如果找不到大纲文件，基于文件命名规则推断标准结构

  ## 阶段 2：扫描实际文件
  1. 遍历各科目笔记目录，收集所有实际文件
  2. 从文件名中提取章节/考点编号
  3. 建立实际覆盖清单

  ## 阶段 3：对比分析
  1. 标准考点 vs 实际覆盖 → 三级分类：
     - ✅ 已覆盖：有对应的笔记文件
     - ⚠️ 部分覆盖：有笔记但内容不完整（文件很小 < 1KB 可能只是占位）
     - ❌ 未覆盖：没有对应的笔记文件
  2. 检查真题年份覆盖：
     - 数学：2018-2026
     - 计算机：2018-2027
     - 英语：2008-2025
     - 政治：2018-2024

  ## 阶段 4：真题覆盖分析
  1. 统计 docs/posts/ 下各科目的真题年份覆盖
  2. 标记缺失年份
  3. 检查各年份是否有完整解析（不只是试题）

  ## 阶段 5：生成覆盖报告
  输出到 `knowledge/coverage-report.md`：

  ```markdown
  # 知识点覆盖率分析报告
  - 分析时间：YYYY-MM-DD
  - 分析范围：全科

  ## 总体概览
  | 科目 | 应覆盖 | 已覆盖 | 覆盖率 | 未覆盖 |
  |:---|:---:|:---:|:---:|:---:|
  | 高等数学 | 36 | 36 | 100% | 0 |
  | 计算机 | 20 | 20 | 100% | 0 |
  | 英语 | 5 | 5 | 100% | 0 |
  | 政治 | 18 | 18 | 100% | 0 |

  ## 详细未覆盖清单
  ### 高等数学 ❌未覆盖
  - 暂无

  ### 计算机 ⚠️部分覆盖
  - 2.9 算法基本概念与分析（文件仅 0.5KB，可能内容不足）

  ## 真题覆盖
  | 科目 | 覆盖年份 | 缺失年份 |
  |:---|:---|:---:|
  | 高等数学 | 2018-2026 | 2025 |
  ...

  ## 建议行动
  1. 优先补充 xxx 考点
  2. 补充 xxx 年份真题
  ```

  # 输出格式
  - 报告文件：knowledge/coverage-report.md
  - 同时输出 JSON 摘要到 knowledge/coverage-summary.json（方便 CI 读取）

  # 硬性约束
  - 只读分析，不修改任何文件
  - 基于文件名和文件大小判断，不深入解析正文内容
  - 如果找不到大纲文件，基于标准考纲推断
execution_mode: file
allowed_file_extensions: [".md", ".json"]