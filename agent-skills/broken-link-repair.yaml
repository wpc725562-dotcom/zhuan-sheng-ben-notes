name: broken-link-repair
version: 1.0.0
description: 扫描仓库全部Obsidian wiki双链，检测断链并批量修复（空格/连字符不匹配、引用不存在文件）
trigger_words:
  - 修复断链
  - 检查链接
  - 断链修复
  - 链接检查
system_instructions: |
  # 任务目标
  检测并修复仓库中失效的 Obsidian wiki 双链（[[...]]），保证笔记库链接完整。

  # 断链分类与修复规则
  ## 1. 空格 vs 连字符不匹配（最常见，约90%）
  - 现象：链接写 `[[1.1 C语言概述]]`，实际文件 `1.1-C语言概述.md`（空格→连字符）
  - 修复：把 md 中的 `[[旧名]]` 替换为 `[[新名]]`（basename 空格替换为连字符后再匹配）
  - 规则：只改链接，不改文件名；替换前全库备份

  ## 2. 引用不存在的文件
  - 现象：链接指向全库不存在的笔记
  - 处理：先确认是否只是路径写法问题（Obsidian 支持按 basename 解析）；真不存在则在文档中标注 [链接失效] 或删除该链接

  ## 3. 目录链接
  - 现象：`[[第一章 函数与极限]]` 指向目录
  - 处理：Obsidian 可跳转目录，不算断链，保留

  # 校验步骤
  1. 修复后重新扫描，断链数应显著下降
  2. 抽查 3-5 处修复点人工确认
  3. 输出修复报告：修复数量、剩余断链数、残留断链清单

  # 硬性约束
  - 只修改链接文本，绝不修改笔记正文内容
  - 修复前 git 提交或备份，保证可回滚
execution_mode: file
allowed_file_extensions: [".md"]
